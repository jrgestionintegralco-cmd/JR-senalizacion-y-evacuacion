services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: jr_platform
      POSTGRES_USER: jr_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - jr_postgres_data:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jr_app -d jr_platform"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-jr_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change_me_minio}
    volumes:
      - jr_minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-jr_minio} $${S3_SECRET_KEY:-change_me_minio}
        && mc mb --ignore-existing local/$${S3_BUCKET:-jr-platform-files}
        && mc anonymous set none local/$${S3_BUCKET:-jr-platform-files}
    env_file: .env

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    env_file: .env
    environment:
      API_PORT: 4000
      DATABASE_URL: postgresql://jr_app:${POSTGRES_PASSWORD:-change_me}@postgres:5432/jr_platform
      S3_ENDPOINT: http://minio:9000
      WEB_ORIGIN: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.4.0
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  jr_postgres_data:
  jr_minio_data:
