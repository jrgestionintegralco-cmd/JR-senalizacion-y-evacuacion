services:
  - type: web
    name: safe-enter-render-staging
    runtime: docker
    plan: free
    autoDeploy: false
    dockerfilePath: ./deployment/render-staging/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safe-enter-render-staging-db
          property: connectionString
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
      - key: SESSION_TTL_HOURS
        value: '8'
databases:
  - name: safe-enter-render-staging-db
    plan: free
    databaseName: safe_enter_render_staging
    user: staging_app
    postgresMajorVersion: '16'
